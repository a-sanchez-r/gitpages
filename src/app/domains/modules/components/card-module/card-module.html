<div class="max-w-screen-xl flex flex-wrap gap-6 justify-center mx-auto p-4">
  <div *ngFor="let card of cardInfo" class="max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700">
    <fa-icon [icon]="card.icon" size="3x" class="w-7 h-7 text-gray-500 dark:text-gray-400 mb-3"></fa-icon>
    <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
      {{ card.title }}
    </h5>
    <p class="mb-3 font-normal text-gray-700 dark:text-gray-400">
      {{ card.description }}
    </p>
    <a [routerLink]="card.link" class="inline-flex items-center px-3 py-2 text-sm font-medium text-center text-white bg-amber-200 rounded-lg hover:bg-amber-300 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-500 dark:hover:bg-blue-700 dark:focus:bg-sky-500">
      Ir al Módulo
    </a>
  </div>
</div>
